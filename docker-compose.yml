services:
  postgres:
    image: postgres:17-alpine
    container_name: dcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-d_computer_service}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-d_computer_service}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Lưu token version. Đang dùng Redis sẵn có ở máy/hạ tầng khác thì bỏ qua service này,
  # chỉ cần trỏ REDIS_HOST/REDIS_PORT trong .env.
  redis:
    image: redis:7-alpine
    container_name: dcs-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: dcs-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  postgres-data:
  redis-data:

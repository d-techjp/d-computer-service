name: SMSF-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Capture deploy metadata
        id: deploy_meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "deploy_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build & push d-computer-service image
        working-directory: ./
        run: |
          chmod +x ./script/docker/run-build-image.sh
          ./script/docker/run-build-image.sh
          
      - name: SSH to VPS and Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/d-computer
            docker compose pull d-computer-service
            docker compose up -d d-computer-service
            docker image prune -f
